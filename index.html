<script>
'use strict';
const MEMORIES=[
{id:"foyer",file:"the_foyer_incident.txt",label:"the foyer incident",date:"form 5",tag:"you really had no idea what that meant to me",image:"",paragraphs:["ik i've retold this story like a thousand times but i wanna remind you again!! remember when we got our f5 class allocations at the foyer?? i keep coming back to this because you did something so unbelievably you that day. i was genuinely so upset cause i looked at 5 med and thought oh god i dont have friends here who am i even gonna sit with lol. and ig i was complaining about it to nana when you suddenly appeared and then you just said you'd sit with me.", "like you didnt turn it into a whole thing. and then of course I CRIED. crying because someone said they'd sit with me. very normal behaviour HAHAHAH sorry la", "but i think that says so much about you. you have this way of making people feel wanted without announcing that you're doing it. you never made me feel like i was an extra person you had to squeeze into your plans. it was always just come with me, sit here, sini la, jom weh.", "and you were so good at pulling people into your world too. you had your people and your million things going on and still somehow found room for me in all of that. i dont think you realise how much that can mean to the person on the receiving end.", "you made our f5 year feel like something i actually got to be part of instead of something i was watching happen to everyone else and i hope you know that the kind of person who does that without thinking twice is a pretty freaking incredible person. like bffr you're amazing eiya."]},
{id:"surau",file:"aabu_lore_FINAL.txt",label:"the aabu lore",date:"outside the girls entrance at the surau",tag:"one of your most dramatic moments ever",image:"",paragraphs:["i dont think yk where im going with this HDSSJHDJSHDPDKDLPLEASE.", "i think we were walking back from class and you were yapping as always and then once we got in front of surau punya side entrance tu, something clicked in your head about aabu. and you literally went down on your KNEES. i was laughing uncontrollably while you were like, realising that you were doomed weh cause you liked AABU. like this was a whole movie scene to you. i wish i could replay it because i can still picture it and it kills me every time.", "but okay la point is beyond the sheer drama i think there was something really sweet about the way you felt things. i noticed that you were never just halfway about something. when you were excited, scared, in love, or confused ke whatever it was, there was so much of you in it. you cared with your whole chest heart mind all of you.", "ik the story with aabu became more complicated later. im not trying to rewrite any of the bad bits or tell you how to feel about any of it now. i just dont want the difficult ending to erase the parts where you were genuinely happy and where something so beautiful existed.", "you deserved those happy moments. you deserved to be excited about someone and to experience that kind of love, even if it didnt last forever. the way i see it is that just because something ended doesnt mean every good thing that came before it disappears.", "and anyway if anyone ever asks me about you guys, ill always be like well she literally collapsed in front of the surau when she realised she liked him. how much more romantic could it get? hihi"]},
{id:"locker",file:"your_books_again.log",label:"the books situation",date:"basically every day",tag:"the desk i could recognise anywhere",image:"",paragraphs:["i cannot picture our classroom without picturing your table and the amount of books you had on it 😭 istg we had lockers for a reason and you probably had more than one but the books were still on your table all the time.", "sometimes they'd end up on my side too and id just look at the little pile slowly taking over. not even saying anything because what was i supposed to say. eiya please stop expanding your territory into mine?? i'd quietly move em tho lol.", "i know i was quite particular about my space back then so sometimes it annoyed me a bit. but mostly its just funny thinking about it now. your table always looked like there were approximately seventeen thousand things happening at once.", "and thats such a familiar image of you to me. all your books, your stuff, your little systems that probably made sense to you even if i couldnt figure them out. i just remember sitting beside you and all your things, and it makes me smile. you made me realise that i could love messy things too and that messy things could be perfect anyway. cause you were so messy yet still so perfect to me.", "god i would recognise that desk anywhere."]},
{id:"medicine",file:"monday_tuesday_wednesday.txt",label:"the little medicine box",date:"one of those little ordinary days",tag:"tiny things i remember about you",image:"",paragraphs:["this is such a random memory but remember the little medicine organiser you had?? the one with monday tuesday wednesday and all the little compartments.", "i remember sorting your pills into it and getting weirdly invested. i think it was one of my first times doing anything like that and i genuinely enjoyed doing it so much 😭 like why was i so happy to be sorting out a medicine container bro i was acting like that was the most important task in the world.", "and i remember how sometimes after taking your medication you'd get sleepy and id find that so endearing. you could be this very loud, busy, full-of-thoughts person and then there was this quieter sleepy version of you too. nyomel", "i loved getting to know those everyday bits of your life. not just the loud stories or the funny stupid things you'd do in class but also the routines that were simply part of being you. and i liked that you were comfortable enough with me to let me help with something so ordinary :))", "you dont have to make some grand gesture to be memorable, eiya. even you sitting there with a tiny pill box has apparently been permanently filed in my brain. its actually a little ridiculous. i love you."]},
{id:"biology",file:"biology_notes.txt",label:"biology class (allegedly)",date:"the lessons we definitely attended",tag:"sorry to our bio teacher",image:"",paragraphs:["i dont even remember how it started but we had those little word games we'd make up on a piece of paper and then every biology class we would just do THAT instead of listening. like yes hello we are here to learn about cells or whatever but first we have a very important game to finish.", "was i the one who started it? idk doesn't matter tho what matters is you played along :) mwah", "also the fact that it kinda became a routine is so funny to me... it wasnt even a one time thing. we kept doing it. i'd literally go into bio class knowing that at some point there would be a piece of paper between us and we'd be off again. and i genuinely looked forward to it. im not even gonna pretend i was excited for bio cause i wasnt AHAHAHHAHA i was excited to sit with you and see what stupid little game we'd play that day.", "and thats one of the things i love about us. but mostly you. you can take something so boring and give it a whole personality. i hope you never lose that side of yourself. that side that can find a game in basically anything and make someone else's ordinary day a bit more fun. it is such a lovely, special thing to have.", "i wish i still had one of those pieces of paper."]},
{id:"cheer",file:"something_i_wanted_to_say.txt",label:"something i wanted to say",date:"not one specific day",tag:"you really are that girl",image:"",paragraphs:["i dont think you understand what a good cheerleader you are. like you're genuinely the sort of person who can get excited over someone else's tiny little thing as if its headline news.", "you'd listen to my random yaps and find something to be excited about, even when it was very questionable and definitely did not need that level of enthusiasm 😭 but that was so you tho. you made room for other people's excitement.and you have this lovely way of believing in people without making them feel like they have to earn it first. you can be realistic and know that life is difficult and still be so full of hope for someone. i love that about you.", "youre also so openly affectionate. you make loving your friends feel normal, like why wouldnt you tell them, hug them, hype them up, check on them. and i really hope you receive that same kind of love back, in all the ways you need it.", "idk if this makes sense but sometimes i wish you could be a friend to yourself the way you're a friend to other people. only then you'd truly understand why people love you so much.", "theres so much more to you than these ten files obviously. but i hope these little stories make it obvious how much of you there is to love."]},
{id:"hug",file:"that_one_hug.txt",label:"that one hug",date:"one day in class",tag:"you noticed before i could explain",image:"",paragraphs:["i wonder if you remember this at all. i was kind of crouching in class in a horrible mood and i genuinely cannot remember what had happened. maybe i merajuk cause we'd barely spent time together or maybe i was jealous about something. i really dont know.", "what i DO remember is you noticing. out of everything going on around you, you could tell something was off. and instead of ignoring it or telling me i was being ridiculous, you actually wanted to know what was wrong. of course i eventually told you and i was so embarrassed because whatever the feeling was, i thought it was stupid. i thought surely anyone else would think i was being so dramatic. and you just hugged me eiya. no making me defend the feeling or explain why i deserved to feel that way. just a simple hug. i still remember that part so vividly.", "i think you have such a rare gentleness to you, especially when someone is being vulnerable in a way that isnt pretty or sensible or easy to explain. i love how you dont always need someone to arrive with the perfect words before you make them feel loved.", "i cant remember the reason i was upset which is honestly kind of annoying considering how well i remember the rest. but i remember how safe i felt with you. i remember that you were kind when you really didnt have to be.", "thank you for being the kind of person who notices. that hug has stayed with me longer than whatever problem started it. and i wanted you to know."]},
{id:"dinner",file:"f5_dinner_without_you.txt",label:"f5 dinner without you",date:"our form 5 dinner",tag:"i dont think i ever told you this",image:"",paragraphs:["this is something i never really told anyone but remember our f5 dinner? obviously you werent there and i thought it would just be a normal night with everyone else lol but i missed you so much that night. and i dont mean that as a guilt trip pls 😭 you had every right not to be there although idr why? family trip was it? anyway it just made me realise how much life you'd brought into our everyday school routines without even trying.", "i ended up hanging around with random people and it just wasnt the same. i watched pablos perform which was pretty fun ngl, but i kept wishing you could've been there to see everything and talk about it with me afterwards.", "and one of my favourite parts of that entire evening was somehow the facetime call with you. im pretty sure aabu called you, although my memory of the logistics is a bit questionable heheh. i just remember seeing you on the screen and being so happy.", "you have this little effect on me where a place feels a little more like home when youre there.", "i hated that f5 dinner. so so much. and i dont think i ever realised just how much i wished you were there until i started thinking about that night again."]},
{id:"secrets",file:"things_we_told_each_other.txt",label:"things we told each other",date:"all those conversations",tag:"thank you for trusting me",image:"",paragraphs:["ik we always joke about being trauma bonded friends but maybe theres a tiny bit of truth there shjhdsj.", "you've always been someone a lot of people want to know. you have friends, people around you, stories and connections and all these different parts of your life. and i think that's because you're genuinely such an interesting person to be around.", "but what i especially appreciate is that you let people see the things beyond the fun surface when you feel safe with them. you trusted me with feelings and thoughts and pieces of your life that weren't for everyone and that wasnt something i ever wanted to take lightly.", "i probably couldnt list every single secret or conversation now. a lot of the exact details have faded but i remember you being honest. i remember you letting yourself be more than just the person everyone sees.", "i think there is so much courage in being open like that, especially when you're someone who's surrounded by people and might feel like you always have to be a certain version of yourself. you never owed anyone access to every part of you and i was so so grateful for the trust.", "i hope you always have people you can be completely yourself with. people you can ramble to, be serious with, say the ugly thought out loud to, or just sit beside without explaining a single thing. you deserve that kind of safety too sayang."]},
{id:"spm",file:"spm_results_day.txt",label:"hi",date:"the day we got our spm results",tag:"this is very overdue",image:"",paragraphs:["eiya i really shouldve said this properly ages ago but i was SO proud of you on spm results day. like genuinely. and not just because of whatever was printed on the slip.", "i saw some of what that year was like for you. academics werent always easy and there was so much else you were carrying at the same time. sometimes you'd compare yourself with your siblings or your family because everyone was so academically brilliant fr and i remember wishing you could see what i saw.", "you were only seventeen weh. literally a baby. and yet there was all this pressure to do well and have things figured out and measure yourself against people who'd had different journeys. i wish someone could've taken some of that weight off your shoulders.", "because eiya you are SMART. i mean that very seriously. not only in a classroom or exam sense. the way your brain works, the way you talk, the way you manage to put complicated feelings into words, it genuinely amazes me. plus you write so beautifully and i hope you know that.", "and you somehow manage to be both a realist and a dreamer, but like to the most extreme levels of both. like how does that even work bro. the way you can see how things really are and still imagine how lovely they could become. basically a delusional realist lol. that is such a rare combination and i've honestly yet to see it in someone else.", "youre amazing at so many things that dont fit neatly into grades. you care about people, you notice things, you have crazy ideas, you see possibilities. i hope being around people who are very academically successful never makes you forget that those things matter just as much.", "so yes, when our results came out, i was happy because you had made it through that journey. you did that my love. and obviously you've achieved so many great things since then :)", "this is ridiculously overdue, but im proud of the girl you were at seventeen and i am so excited for the woman youre becoming at twenty one. and i really hope you're proud of her too. she deserves it."]}
];
const TOTAL=MEMORIES.length;
const $=s=>document.querySelector(s),wins=new Map(),seen=new Set();let topZ=9,serial=0,finalShown=false,toastTimer;
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function computerSVG(){return `<svg viewBox="0 0 32 32" aria-hidden="true"><path fill="#000" d="M4 3h24v18H4z"/><path fill="#c0c0c0" d="M5 4h22v16H5z"/><path fill="#000080" d="M7 6h18v10H7z"/><path fill="#000" d="M13 21h6v2h4v3H9v-3h4z"/></svg>`}
function binSVG(){return `<svg viewBox="0 0 32 32" aria-hidden="true"><path fill="#000" d="M9 8h14l-2 18H11z"/><path fill="#d9d9d9" d="M10 9h12l-2 16H12z"/><path fill="#fff" d="M12 5h8v3h-8z"/><path stroke="#00a000" stroke-width="1.5" d="M13 14l2 2 4-5M12 19l2 2 5-6"/></svg>`}
function letterSVG(){return `<svg viewBox="0 0 32 32" aria-hidden="true"><path fill="#000" d="M4 8h24v16H4z"/><path fill="#fff" d="M5 9h22v14H5z"/><path stroke="#000080" stroke-width="1.5" fill="none" d="M6 10l10 8 10-8"/></svg>`}
function briefcaseSVG(){return `<svg viewBox="0 0 32 32" aria-hidden="true"><path fill="#000" d="M4 10h24v16H4z"/><path fill="#c8b07d" d="M5 11h22v14H5z"/><path fill="#000" d="M11 7h10v3H11z"/><path fill="#8d6d3e" d="M12 8h8v2h-8z"/></svg>`}

function iconFor(type){return {folder:folderSVG(),paper:paperSVG(),computer:computerSVG(),bin:binSVG(),letter:letterSVG(),briefcase:briefcaseSVG(),globe:globeSVG()}[type]||paperSVG()}
const desktopFiles=[
{app:'welcome',name:'My Computer',icon:'computer'},
{app:'archives',name:'My Documents',icon:'folder'},
{app:'birthday',name:'Inbox',icon:'letter'},
{app:'archives',name:'Recycle Bin',icon:'bin'},
{app:'archives',name:'My Briefcase',icon:'briefcase'},
{app:'welcome',name:'The Internet',icon:'globe'},
{app:'foyer',name:'foyer_story.txt',icon:'paper'},
{app:'birthday',name:'birthday_letter.txt',icon:'paper'}];
$('#desktopIcons').innerHTML=desktopFiles.map(f=>`<button class="desktop-icon" ${f.app?`data-open="${f.app}" title="open ${escapeHTML(f.name)}`:`data-app="noop" title="${escapeHTML(f.name)}`}"><span class="desk-icon">${iconFor(f.icon)}</span><span class="file-caption">${escapeHTML(f.name)}</span></button>`).join('');
function toast(title,message){clearTimeout(toastTimer);$('#toastArea').innerHTML=`<div class="toast"><div class="t-title">${escapeHTML(title)}</div>${escapeHTML(message)}<br><button id="toastOk">ok</button></div>`;$('#toastOk').onclick=()=>$('#toastArea').innerHTML='';toastTimer=setTimeout(()=>$('#toastArea').innerHTML='',6100)}
function status(){const n=seen.size;$('#statusCount').textContent=`files recovered: ${n}/${TOTAL}`;document.title=`eiya.exe | ${n}/${TOTAL} memories recovered`;if(n===TOTAL&&!finalShown){finalShown=true;toast('all done hehe','birthday_letter.txt is open now');}}
function focusWin(id){let w=wins.get(id);if(!w)return;w.el.style.display='flex';w.el.style.zIndex=++topZ;document.querySelectorAll('.window').forEach(x=>x.classList.remove('active'));w.el.classList.add('active');renderTabs()}
function renderTabs(){let rows=[...wins.values()];$('#taskTabs').innerHTML=rows.map(w=>`<button class="task-tab ${w.el.classList.contains('active')?'active':''}" data-focus="${w.id}">${escapeHTML(w.name)}</button>`).join('')}
function closeWin(id){let w=wins.get(id);if(!w)return;w.el.remove();wins.delete(id);renderTabs()}
function makeWin(id,name,html,statusText='ready'){if(wins.has(id)){let w=wins.get(id);w.el.querySelector('.win-body').innerHTML=html;focusWin(id);return w.el}let el=document.createElement('section');el.className='window';el.setAttribute('role','dialog');el.setAttribute('aria-label',name);el.dataset.id=id;let offset=serial++%4;el.style.left=`max(10px,calc(50% - 335px + ${offset*22}px))`;el.style.top=`${55+offset*28}px`;el.innerHTML=`<div class="win-titlebar"><span class="win-title">${escapeHTML(name)}</span><div class="win-controls"><button class="win-control win-min" title="minimize" aria-label="minimize window">_</button><button class="win-control win-max" title="maximize" aria-label="maximize window">□</button><button class="win-close" aria-label="close window">×</button></div></div><div class="win-menubar"><span>File</span><span>Edit</span><span>View</span><span>Go</span><span>Help</span></div><div class="win-body">${html}</div><div class="win-status">${escapeHTML(statusText)}</div>`;$('#windows').append(el);wins.set(id,{id,name,el});focusWin(id);el.querySelector('.win-close').onclick=()=>closeWin(id);el.querySelector('.win-min').onclick=()=>{el.style.display='none';renderTabs()};el.querySelector('.win-max').onclick=()=>{if(el.dataset.maximized==='yes'){el.style.width='';el.style.height='';el.style.left=el.dataset.oldLeft;el.style.top=el.dataset.oldTop;el.dataset.maximized='no'}else{el.dataset.oldLeft=el.style.left;el.dataset.oldTop=el.style.top;el.style.left='5px';el.style.top='5px';el.style.width='calc(100vw - 10px)';el.style.height='calc(100dvh - 42px)';el.dataset.maximized='yes'}};el.addEventListener('pointerdown',()=>focusWin(id));let bar=el.querySelector('.win-titlebar');bar.addEventListener('pointerdown',e=>{if(e.target.closest('button')||innerWidth<681)return;const px=e.clientX,py=e.clientY,startX=el.offsetLeft,startY=el.offsetTop;bar.setPointerCapture(e.pointerId);function move(q){const nx=Math.max(0,Math.min(innerWidth-el.offsetWidth,startX+q.clientX-px));const ny=Math.max(0,Math.min(innerHeight-90,startY+q.clientY-py));el.style.left=nx+'px';el.style.top=ny+'px'}function end(){bar.removeEventListener('pointermove',move);bar.removeEventListener('pointerup',end);bar.removeEventListener('pointercancel',end)}bar.addEventListener('pointermove',move);bar.addEventListener('pointerup',end);bar.addEventListener('pointercancel',end)});return el}
function footerButtons(actions){return `<div class="win-actions">${actions.map(a=>`<button class="small-button" data-open="${a.app}">${escapeHTML(a.label)}</button>`).join('')}</div>`}
function openWelcome(){makeWin('welcome','read_me_first.txt',`<div class="win-breadcrumb">Address  C:\\read_me_first.txt</div><h2>eiyaaaa</h2><p>HAPPY BELATED 21ST BIRTHDAY MY GIRLLLL 😭</p><p>first of all im sooo sorry this is late. like genuinely sorry. 21 on the 21st??? your GOLDEN BIRTHDAY??? i really wanted to do something proper for you instead of just half assing a message and calling it a day. so obviously i got carried away trying to make something special and then ran out of time anyway. very smart of me SHDJHSDKJ.</p><p>i know i shouldve had this ready on your actual birthday. i hope you know the delay has nothing to do with how important you are to me. i just wanted you to have something that actually felt like you.</p><p>so here are some little stories i still remember about you. some are stupid, some are soft, and some are things i shouldve told you a long time ago. i made you this tiny archive because there is genuinely so much about you worth celebrating.</p><p>open my documents and read the files in any order. there's a birthday letter waiting after all ten.</p>${footerButtons([{app:'archives',label:'okay let me see'}])}`,'hi eiya');}
function openArchives(){let cards=MEMORIES.map((m,i)=>`<button class="file-tile" data-open="${m.id}"><span class="tile-icon">${paperSVG()}</span><span class="tile-name">${escapeHTML(m.file)}</span><span class="tile-type">${seen.has(m.id)?'✓ read':'open file'}</span></button>`).join('');makeWin('archives','C:\\My Documents',`<div class="win-breadcrumb">Address  C:\\My Documents</div><h2>the eiya archives</h2><p class="win-sub">some stuff i still remember</p><div class="system-callout"><strong>recovery progress:</strong> ${seen.size} / ${TOTAL} memories<div class="progress-track"><div class="progress-fill" style="width:${seen.size/TOTAL*100}%"></div></div>read them all and then open your birthday letter.</div><div class="folder-grid">${cards}</div>${footerButtons([{app:'birthday',label:'birthday_letter.txt →'}])}`,`${TOTAL} archived files`)}
function openMemory(id){const m=MEMORIES.find(x=>x.id===id);if(!m)return;let fresh=!seen.has(id);seen.add(id);status();let paragraphs=m.paragraphs.map(s=>`<p>${escapeHTML(s)}</p>`).join('');let photo=m.image?`<figure style="margin:0 0 20px"><img src="${escapeHTML(m.image)}" alt="one of our memories" style="max-width:100%;max-height:280px;object-fit:contain;border:7px solid white;box-shadow:3px 3px 0 #c9d3d8"></figure>`:'';makeWin(id,m.file,`<div class="win-breadcrumb">Address  C:\\My Documents\\${escapeHTML(m.file)}</div><h2>${escapeHTML(m.label)}</h2>${photo}<div class="memory-story">${paragraphs}</div>${footerButtons([{app:'archives',label:'← back to all the memories'},{app:'birthday',label:'birthday_letter.txt →'}])}`,'memory recovered ✓');if(fresh){toast('opened',`${seen.size}/${TOTAL} read${seen.size===TOTAL?'. okay birthday file is ready hehe':''}`)}if(wins.has('archives')){let w=wins.get('archives');let body=w.el.querySelector('.win-body');let wasScroll=body.scrollTop;const old=w.el;let html=body.innerHTML;html=html.replace(/<div class="progress-fill" style="width:[^"]+"/,`<div class="progress-fill" style="width:${seen.size/TOTAL*100}%"`).replace(/<strong>recovery progress:<\/strong> \d+ \/ \d+/,`<strong>recovery progress:</strong> ${seen.size} / ${TOTAL}`);body.innerHTML=html;body.scrollTop=wasScroll;body.querySelectorAll('.file-tile').forEach(b=>{let key=b.dataset.open;let tag=b.querySelector('.tile-type');if(tag)tag.textContent=seen.has(key)?'✓ read':'open file'})}}
function openBirthday(){if(seen.size<TOTAL){const remaining=TOTAL-seen.size;let el=makeWin('birthday','birthday_letter.txt',`<div class="win-breadcrumb">Address  C:\\birthday_letter.txt</div><h2>not yettt</h2><p>eiya there are still ${remaining} stories left pls go read them first 😭</p>${footerButtons([{app:'archives',label:'fine fine'}])}`,'locked');el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake');return}
makeWin('birthday','birthday_letter.txt',`<div class="win-breadcrumb">Address  C:\\birthday_letter.txt</div><div class="letter"><h2>happy belated golden birthday eiyaaaa ♡</h2><p>okay first of all sorry AGAIN for being late. this was supposed to land on your actual birthday and i swear i had such ambitious plans for it. your 21st on the 21st only happens once and i wanted you to feel properly celebrated. then i spent too long trying to get it right and here we are. i hope you can forgive your very unserious friend 😭😭😭😭</p><p>but anyway. YOU&#x27;RE TWENTY ONE????? when did that happen. it feels like we were just seventeen and doing absolutely ridiculous things in mrsm and now somehow you&#x27;re a whole adult. not that i think being twenty one means you need to have your life sorted out btw. i refuse to accept that kind of pressure for you.</p><p>i hope twenty one is such a good year for you eiya. not necessarily in a big impressive life-changing way, although obviously if you get everything you want i will be cheering from here wohoo. i mean in all the little ways too. i hope you wake up to days you&#x27;re excited for. i hope you laugh until you cant speak. i hope you find more things you love doing and people who make you feel safe being completely yourself. i hope you give yourself more credit. i know how easily you can be hard on yourself and how sometimes you probably see all the things you havent done instead of how much youve already managed. but you have so much in you. so much intelligence and warmth and imagination and love. you do not need to be perfect or impressive every single day to deserve good things.</p><p>and i hope youre loved loudly. properly. patiently. the way you love your people. i hope someone checks on you when you&#x27;re quiet, listens when you&#x27;re rambling and yapping and not making any sense, remembers the tiny things you mention, and celebrates your wins as enthusiastically as you celebrate everyone else&#x27;s. you deserve all of that and more sayang.</p><p>i wish i could celebrate this birthday with you in person. i miss you and i want to hear more about the person you&#x27;re becoming instead of just the girl i knew in high school. i wish we talked more. i wish you&#x27;d tell me about the good stuff, the annoying stuff, the totally random stuff. all of it. is it too much to ask that i still want to know you in every chapter?</p><p>happy 21st, my eiya. im so proud of you and so so excited for everything thats waiting for you. i love you an unreasonable amount. im sorry for the late wish, but please know i really did make this with so much love.</p><p class="letter-sign">i love you always,<br>farah ♡</p></div>${footerButtons([{app:'archives',label:'back to the memories'}])}`,'happy belated birthday ♡');}
function openApp(id){$('#startMenu').classList.remove('open');$('#startBtn').classList.remove('pressed');if(id==='noop'){toast('nothing here','thats just for the windows 95 vibes hehe');return}if(id==='welcome')openWelcome();else if(id==='archives')openArchives();else if(id==='birthday')openBirthday();else openMemory(id)}
document.addEventListener('click',e=>{let open=e.target.closest('[data-open],[data-app]');if(open){openApp(open.dataset.open||open.dataset.app);return}let tab=e.target.closest('[data-focus]');if(tab){focusWin(tab.dataset.focus);return}if(!e.target.closest('#startMenu,#startBtn')){$('#startMenu').classList.remove('open');$('#startBtn').classList.remove('pressed')}});
$('#startBtn').onclick=()=>{let s=$('#startMenu');s.classList.toggle('open');$('#startBtn').classList.toggle('pressed',s.classList.contains('open'))};$('#restart').onclick=()=>{seen.clear();finalShown=false;[...wins.keys()].forEach(closeWin);status();openWelcome();$('#startMenu').classList.remove('open')};$('#clock').textContent=new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
$('#bootFill').style.width='100%';$('#bootStatus').innerHTML='10 files found.<br>ready to open.';$('#enterBtn').onclick=()=>{let b=$('#boot');b.classList.add('hidden');setTimeout(()=>b.remove(),500);openWelcome()};
</script>
